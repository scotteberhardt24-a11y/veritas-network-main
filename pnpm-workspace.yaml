packages:
  - "backend"
  - "apps/*"
  - "shared"
allowBuilds:
  '@prisma/client': false
  '@prisma/engines': false
  '@railway/cli': true
  bcrypt: false
  esbuild: false
  keccak: set this to true or false
  msgpackr-extract: false
  prisma: false
  secp256k1: set this to true or false
  sharp: false
  unrs-resolver: false
